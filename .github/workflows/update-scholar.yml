name: Update Google Scholar metrics

"on":
  schedule:
    # Run monthly on the first day at 03:17 UTC.
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the homepage
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scholar.txt

      - name: Install the Scholar updater
        run: python -m pip install -r requirements-scholar.txt

      - name: Fetch and validate Scholar metrics
        run: python scripts/update_scholar.py
        env:
          GOOGLE_SCHOLAR_USER_ID: dRAn7W4AAAAJ

      - name: Commit changed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          if git diff --cached --quiet; then
            echo "No Scholar changes to commit."
          else
            git commit -m "chore: update Google Scholar metrics"
            git push
          fi
